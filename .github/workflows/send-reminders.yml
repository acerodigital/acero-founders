name: Send daily check-in reminders

on:
  schedule:
    # 04:00 UTC = 9:00 AM Pakistan Standard Time (UTC+5)
    - cron: "0 4 * * *"
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab to test

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install firebase-admin@12

      - name: Send reminders
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/send-reminders.js
